# Default platform pyproject.toml (x86, GB200, and any non-Jetson GPU)

[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Common-lib exact pins relaxed to floors so isaacsim 5.1.0's exact pins win
    # (it ships newer matplotlib/scipy/etc. than gr00t's tested versions).
    "albumentations>=1.4.18",
    "huggingface-hub[cli]",
    "opencv-python-headless>=4.5,<4.13",
    "av>=16.1.0",
    "diffusers==0.35.1",
    "dm-tree",
    "lmdb>=1.7.5",
    "msgpack>=1.1.0",
    "msgpack-numpy>=0.4.8",
    "pandas>=2.2.3",
    "peft==0.17.1",
    "termcolor>=3.2.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.57.3",
    "tyro==0.9.17",
    "click==8.1.7",
    "datasets>=3.6.0",
    "cryptography>=44.0.0",
    "einops>=0.8.1",
    "gitpython>=3.1.46",
    "jsonlines>=4.0.0",
    "gymnasium==1.2.0",
    "matplotlib>=3.10.1",
    "numpy==1.26.0",
    "omegaconf>=2.3.0",
    "scipy>=1.15.3",
    # x86_64: PyPI wheel; aarch64 Linux: prebuilt wheel in scripts/deployment/dgpu/wheels/
    "torchcodec==0.4.0; platform_machine == 'x86_64'",
    "torchcodec==0.10.0a0; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "wandb>=0.24.0",
    "pyzmq>=27.0.1",
    # deepspeed publishes wheels only for x86_64 Linux.
    "deepspeed==0.17.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # triton is needed on aarch64 (GB200) but ships with torch on x86_64
    "triton==3.3.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    # Pinned to match the polaris_real2sim root env (built from source via root no-build-isolation).
    "flash-attn==2.8.3; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    # onnx / onnxscript / tensorrt removed: deployment-export only (scripts/deployment/),
    # not imported by the gr00t package or Gr00tPolicy inference path. onnx>=1.20 forces
    # ml-dtypes>=0.5.0 which conflicts with the root JAX stack pin (ml-dtypes==0.4.1).
]

[project.optional-dependencies]
dev = [
    "boto3",
    "ruff",
    "ipython",
    "pytest",
    "pytest-timeout",
    "build",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr00t*"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
triton = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchcodec = [
    { path = "scripts/deployment/dgpu/wheels/torchcodec-0.10.0a0-cp310-cp310-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.7.0", "numpy==1.26.0", "triton==3.3.1"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "gpu: tests that require a GPU",
    "multigpu: tests that require multiple GPUs and use all visible GPUs",
]
# Include fixture setup/teardown in JUnit <testcase time="..."> so duration
# reports (ci/print_duration_summary.py) and TestRun.duration in testdb
# reflect real wall-clock time. With the default ("call"), expensive
# session/module/class-scoped fixtures (e.g. NFS->local model staging,
# Gr00tPolicy load) are invisible and tests look misleadingly fast.
junit_duration_report = "total"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["gr00t"]
exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".vscode",
    ".venv",
    "dist",
    "logs",
    "*.ipynb",
    "external_dependencies",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = false
split-on-trailing-comma = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[[tool.uv.index]]
name = "nvidia-pypi"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
